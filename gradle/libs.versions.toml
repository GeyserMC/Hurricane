[versions]
configurate ="4.2.0-SNAPSHOT"
geyser ="2.9.0-SNAPSHOT"
floodgate ="2.2.3-SNAPSHOT"
paper ="1.18.2-R0.1-SNAPSHOT"
paperweight = "1.7.7"
shadow = "9.2.2"
javadowngrader = "1.0.0"
architectury-plugin = "3.4-SNAPSHOT"
architectury-loom = "1.11-SNAPSHOT"
minecraft-version = "1.21.3"
typesafe = "1.4.2"
geantyref = "1.3.14"
asm = "5.2"
mixin = "0.8.5"
minotaur = "2.+"
lombok = "8.6"

# fabric
fabric-loader = "0.16.8"
fabric-api = "0.107.3+1.21.3"

# neoforge
neoforge-version = "21.3.0-beta"

[libraries]
floodgate-api = { group = "org.geysermc.floodgate", name = "api", version.ref = "floodgate" }
geyser-api = { group = "org.geysermc.geyser", name = "api", version.ref = "geyser" }
paper-api = { group = "io.papermc.paper", name = "paper-api", version.ref = "paper" }

minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft-version" }
typesafe = { group = "com.typesafe", name = "config", version.ref = "typesafe" }
geantyref = { group = "io.leangen.geantyref", name = "geantyref", version.ref = "geantyref" }
configurate-hocon = { group = "org.spongepowered", name = "configurate-hocon", version.ref = "configurate" }
configurate-core = { group = "org.spongepowered", name = "configurate-core", version.ref = "configurate" }

architectury-plugin = { group = "architectury-plugin", name = "architectury-plugin.gradle.plugin", version.ref = "architectury-plugin" }
architectury-loom = { group = "dev.architectury.loom", name = "dev.architectury.loom.gradle.plugin", version.ref = "architectury-loom" }
paperweight = { group = "io.papermc.paperweight", name = "paperweight-userdev", version.ref = "paperweight" }
mixin = { group = "org.spongepowered", name = "mixin", version.ref = "mixin" }
asm = { group = "org.ow2.asm", name = "asm-debug-all", version.ref = "asm" }

shadow = { group = "com.gradleup.shadow", name = "shadow-gradle-plugin", version.ref = "shadow" }
javadowngrader = { group = "xyz.wagyourtail.jvmdowngrader", name = "gradle-plugin", version.ref = "javadowngrader" }
minotaur = { group = "com.modrinth.minotaur", name = "Minotaur", version.ref = "minotaur" }

# Fabric
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric-loader" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }

# NeoForge
neoforge = { group = "net.neoforged", name = "neoforge", version.ref = "neoforge-version" }

[bundles]
geyser = [
    "floodgate-api",
    "geyser-api"
]

[plugins]
lombok = { id = "io.freefair.lombok", version.ref = "lombok" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
paperweight = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
